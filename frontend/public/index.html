<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Campus — Connexion</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-chip"></div>
        <div>
          <div class="brand-name">Smart Campus</div>
          <div class="brand-sub">Plateforme carte étudiante</div>
        </div>
      </div>
      <h1>Connexion</h1>
      <p class="sub">Accédez à votre espace Étudiant, Technicien ou Administrateur.</p>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="prenom.nom@campus.edu">
        </div>
        <div class="form-row">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Se connecter</button>
      </form>

    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
